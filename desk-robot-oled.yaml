# This is an alternative firmware for the SAME device, not a second robot.
# The user's 0.96-inch I2C panel is provisionally configured as SSD1306 128x64.
# Its controller and address still need physical confirmation.
packages:
  voice: !include desk-robot.yaml

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 400kHz

display:
  - platform: ssd1306_i2c
    id: robot_face
    model: "SSD1306 128x64"
    address: 0x3C
    # Five frames per second keep I2C refresh work modest during voice streaming.
    update_interval: 200ms
    lambda: |-
      const int phase = id(assistant_phase);
      const uint32_t now = millis();
      // The switch expresses intent; the microphone state confirms capture.
      // This also closes the eyes while the half-duplex assistant speaks.
      const bool listening = id(listening_enabled).state &&
          id(assistant).get_api_connection() != nullptr &&
          id(robot_microphone).is_running() && !id(conversation_closing);
      const bool blink = (now % 4800) < 200;
      const int gaze = listening ? (static_cast<int>((now / 2400) % 3) - 1) * 3 : 0;

      if (!listening || blink) {
        // Closed eyelids remain visible when capture is stopped.
        it.filled_rectangle(26, 31, 27, 3);
        it.filled_rectangle(75, 31, 27, 3);
      } else {
        const int height = phase == 2 ? 30 : 26;
        const int top = 32 - height / 2;
        auto eye = [&](int left) {
          const int radius = 5;
          const int right = left + 26;
          const int bottom = top + height - 1;
          it.filled_rectangle(left + radius, top, 17, height);
          it.filled_rectangle(left, top + radius, 27, height - 10);
          it.filled_circle(left + radius, top + radius, radius);
          it.filled_circle(right - radius, top + radius, radius);
          it.filled_circle(left + radius, bottom - radius, radius);
          it.filled_circle(right - radius, bottom - radius, radius);
        };
        eye(26 + gaze);
        eye(75 + gaze);
      }

      if (phase == 4) {
        const int mouth_height = 2 + ((now / 200) % 4) * 2;
        it.filled_rectangle(56, 51, 16, mouth_height);
      } else if (phase == 3) {
        it.filled_circle(54 + ((now / 250) % 3) * 10, 55, 2);
      } else if (phase == 0 || phase == 6) {
        it.line(57, 55, 71, 55);
        if (phase == 6) {
          it.line(61, 3, 67, 9);
          it.line(67, 3, 61, 9);
        }
      } else if (listening) {
        it.line(58, 53, 62, 56);
        it.line(62, 56, 66, 56);
        it.line(66, 56, 70, 53);
      }
