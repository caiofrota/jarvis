[project]
name = "jarvis-voice"
version = "0.4.0"
description = "Local speech recognition, synthesis, and wakeword runtime for Jarvis Studio."
requires-python = ">=3.11,<3.12"
dependencies = [
  "av==16.0.1",
  "faster-whisper==1.2.1",
  "kokoro>=0.9.4,<1",
  "openwakeword==0.6.0",
  "sounddevice>=0.5.6,<1",
  "soundfile>=0.13.1,<1",
  "torch>=2,<3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
