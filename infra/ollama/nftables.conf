#!/usr/sbin/nft -f

# This dedicated container owns this ruleset.
flush ruleset

table inet ollama {
  chain input {
    type filter hook input priority filter; policy accept;
    iifname "lo" accept
    tcp dport 11434 ip saddr { 192.168.20.10, 192.168.20.11 } accept
    tcp dport 11434 reject with tcp reset
  }
}
