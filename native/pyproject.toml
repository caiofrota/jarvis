[project]
name = "rosie-native"
version = "0.1.0"
description = "Local speech server and room-aware MQTT control for Rosie"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "paho-mqtt>=2.1,<3",
  "numpy>=2,<3",
  "webrtcvad-wheels>=2.0.14,<3",
  "faster-whisper>=1.1,<2",
  "piper-tts>=1.3,<2",
  "scipy>=1.14,<2",
  "kokoro-onnx==0.6.1",
  "misaki==0.9.4",
  "supertonic==1.3.1",
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-core==1.13.8",
]

[dependency-groups]
dev = [
    "clang-format==21.1.8",
    "mypy>=1.19,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
files = ["voice"]
strict = true
follow_imports = "silent"
ignore_missing_imports = true
