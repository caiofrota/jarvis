name: Build desktop

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  package:
    name: package (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Install pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.25.0'
          run_install: false
      - name: Configure dependency cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm dist --win nsis --x64 --publish never
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: pnpm dist --linux AppImage deb --x64 --publish never
      # v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jarvis-${{ github.ref_name }}-${{ runner.os }}-x64
          path: |
            release/**/*.exe
            release/**/*.AppImage
            release/**/*.deb
          if-no-files-found: error
          retention-days: 14
